<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ANTA System</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <div class="wrap">
        <nav>
          <a href="#top" aria-label="ANTA"
            ><img class="logo" src="assets/logo.png" alt="ANTA"
          /></a>
          <div class="links">
            <a href="#modulos" data-i="n1"></a
            ><a href="#procesos" data-i="n2"></a
            ><a href="#funciones" data-i="n3"></a>
          </div>
          <div class="right">
            <button class="lang" id="lang" aria-label="Language"></button
            ><a class="btn p sm login" href="#" data-i="login"></a>
          </div>
        </nav>
      </div>
    </header>

    <main id="top">
      <section class="hero">
        <div class="wrap">
          <h1 class="hand" data-i="h1"></h1>
          <p class="sub hand" data-i="sub"></p>
          <div class="cta">
            <a class="btn p login" href="#" data-i="login"></a
            ><a class="btn s" href="#funciones" data-i="seeF"></a>
            <div class="note hand">
              <svg
                width="60"
                height="40"
                viewBox="0 0 60 40"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
              >
                <path d="M50 4C30 8 14 16 8 34M8 34l-2-12M8 34l12-6" /></svg>
                <span data-i="note"></span>
            </div>
          </div>
          <div class="shot">
            <div class="bar"><i></i><i></i><i></i></div>
            <img
              src="assets/dashboard.webp"
              alt="Dashboard ANTA"
              width="1000"
              height="495"
            />
          </div>
        </div>
      </section>

      <section class="modules" id="modulos">
        <div class="wrap">
          <h2 class="hand" data-i="mT"></h2>
          <p class="lead" data-i="mP"></p>
          <div class="grid6">
            <div class="mod">
              <div class="tile">
                <svg viewBox="0 0 28 28" stroke="#0A0FA3">
                  <rect x="3" y="3" width="9" height="9" rx="2" />
                  <rect x="16" y="3" width="9" height="9" rx="2" />
                  <rect x="3" y="16" width="9" height="9" rx="2" />
                  <rect x="16" y="16" width="9" height="9" rx="2" />
                </svg>
              </div>
              Dashboard
            </div>
            <div class="mod">
              <div class="tile">
                <svg viewBox="0 0 28 28" stroke="#14B8D4">
                  <rect x="3" y="4" width="22" height="20" rx="3" />
                  <path d="M8 11h2M13 11h8M8 17h2M13 17h8" />
                </svg>
              </div>
              <span data-i="m2"></span>
            </div>
            <div class="mod">
              <div class="tile">
                <svg viewBox="0 0 28 28" stroke="#FF9800">
                  <rect x="6" y="3" width="16" height="22" rx="3" />
                  <path d="M10 8h8M10 14h2M16 14h2M10 19h2M16 19h2" />
                </svg>
              </div>
              <span data-i="m3"></span>
            </div>
            <div class="mod">
              <div class="tile">
                <svg viewBox="0 0 28 28" stroke="#9C27B0">
                  <rect x="3" y="4" width="22" height="8" rx="3" />
                  <rect x="3" y="16" width="22" height="8" rx="3" />
                  <path d="M8 8h1M8 20h1" />
                </svg>
              </div>
              <span data-i="m4"></span>
            </div>
            <div class="mod">
              <div class="tile">
                <svg viewBox="0 0 28 28" stroke="#009688">
                  <circle cx="14" cy="14" r="11" />
                  <path
                    d="M14 7v14M17.5 11H12a2.5 2.5 0 000 5h4a2.5 2.5 0 010 5H10"
                  />
                </svg>
              </div>
              <span data-i="m5"></span>
            </div>
            <div class="mod">
              <div class="tile">
                <svg viewBox="0 0 28 28" stroke="#E91E63">
                  <path
                    d="M14 3l10 5.5v11L14 25 4 19.5v-11zM4 8.5l10 5.5 10-5.5M14 14v11"
                  />
                </svg>
              </div>
              <span data-i="m6"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="pad" id="procesos">
        <div class="wrap" style="text-align: center">
          <h2 class="hand" data-i="pT"></h2>
          <p class="lead" data-i="pP"></p>
          <div class="stages">
            <div class="chip" style="--c: var(--c1)" data-i="s1"></div>
            <span class="arrow">›</span>
            <div class="chip" style="--c: var(--c2)" data-i="s2"></div>
            <span class="arrow">›</span>
            <div class="chip" style="--c: var(--c3)" data-i="s3"></div>
            <span class="arrow">›</span>
            <div class="chip" style="--c: var(--c4)" data-i="s4"></div>
            <span class="arrow">›</span>
            <div class="chip" style="--c: var(--c5)" data-i="s5"></div>
            <span class="arrow">›</span>
            <div class="chip" style="--c: var(--c6)" data-i="s6"></div>
          </div>
        </div>
      </section>

      <section class="pad" id="funciones" style="padding-top: 0">
        <div class="wrap">
          <h2 class="hand" style="text-align: center" data-i="bT"></h2>
          <div class="bento">
            <div class="card w3" style="--bg-c: #e4e7ff">
              <h3 class="hand" data-i="b1t"></h3>
              <p data-i="b1p"></p>
              <img src="assets/lotes.webp" alt="Lotes" loading="lazy" />
            </div>
            <div class="card w3" style="--bg-c: #eaf6c8">
              <h3 class="hand" data-i="b2t"></h3>
              <p data-i="b2p"></p>
              <img src="assets/costos.webp" alt="Costos" loading="lazy" />
            </div>
            <div class="card w2" style="--bg-c: #d9f3f8">
              <h3 class="hand" data-i="b3t"></h3>
              <p data-i="b3p"></p>
              <img
                src="assets/inventario.webp"
                alt="Inventario"
                loading="lazy"
              />
            </div>
            <div class="card w2" style="--bg-c: #ffe9c7">
              <h3 class="hand" data-i="b4t"></h3>
              <p data-i="b4p"></p>
              <img
                src="assets/calculadora.webp"
                alt="Calculadora"
                loading="lazy"
              />
            </div>
            <div class="card w2" style="--bg-c: #fbd9e6">
              <h3 class="hand" data-i="b5t"></h3>
              <p data-i="b5p"></p>
              <img src="assets/productos.webp" alt="Productos" loading="lazy" />
            </div>
          </div>
        </div>
      </section>

      <div class="wrap">
        <div class="final">
          <h2 class="hand" data-i="fT"></h2>
          <p style="opacity: 0.8; margin: 0" data-i="fP"></p>
          <a class="btn login" href="#" data-i="login"></a>
        </div>
      </div>
    </main>
    <footer>
      <div class="wrap">© 2026 ANTA System. <span data-i="rights"></span></div>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
